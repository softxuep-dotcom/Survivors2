<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Horde Spark</title>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #0e1410; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; }
  #game { position: fixed; inset: 0; z-index: 2147483000; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; background: #0e1410; }
  .poki-ad-active #game { z-index: 0; pointer-events: none; }
  #game-version { box-sizing: border-box; position: fixed; left: max(10px, env(safe-area-inset-left)); bottom: max(7px, env(safe-area-inset-bottom)); z-index: 2147483100; padding: 3px 6px; border: 1px solid #6f897555; border-radius: 999px; color: #a8b7aa; background: #0b100cb8; font: 600 10px/1 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; letter-spacing: .04em; text-shadow: 0 1px 2px #000; pointer-events: none; user-select: none; }
  .poki-ad-active #game-version { display: none; }
  canvas { display: block; }
  #loading { box-sizing: border-box; position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; gap: 18px; padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); color: #fff; background: #0e1410; font: 700 18px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; text-align: center; transition: opacity .25s ease; }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading-bar { width: min(280px, 68vw); height: 8px; overflow: hidden; border: 1px solid #6f8975; border-radius: 999px; background: #1c2b20; box-shadow: 0 8px 24px #0008, inset 0 1px #ffffff18; }
  #loading-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #58c98f, #ffd34e); transition: width .12s ease; }
  #loading-percent { color: #aed0b4; font-size: 13px; font-weight: 400; }
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite">
  <div>HORDE SPARK</div>
  <div id="loading-bar"><div id="loading-fill"></div></div>
  <div id="loading-percent">0%</div>
</div>
<div id="game"></div>
<script>
  window.setLoadingProgress = function (value) {
    var percent = Math.round(Math.max(0, Math.min(1, value || 0)) * 100);
    document.getElementById('loading-fill').style.width = percent + '%';
    document.getElementById('loading-percent').textContent = percent + '%';
  };
  window.finishLoading = function () {
    window.setLoadingProgress(1);
    var loading = document.getElementById('loading');
    if (!loading) return;
    loading.classList.add('hidden');
    setTimeout(function () { loading.remove(); }, 300);
  };
  window.addEventListener('keydown', function (event) {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(event.code)) event.preventDefault();
  }, { passive: false });
  document.getElementById('game').addEventListener('contextmenu', function (event) { event.preventDefault(); });
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
